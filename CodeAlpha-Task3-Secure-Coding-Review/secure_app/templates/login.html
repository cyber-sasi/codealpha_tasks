{% extends "base.html" %}
{% block title %}Login | SecureReview Demo{% endblock %}
{% block content %}
  <h2>Log in</h2>
  {% if message %}<p role="status">{{ message }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" minlength="3" maxlength="32" required></label><br>
    <label>Password <input name="password" type="password" required></label><br>
    <button type="submit">Login</button>
  </form>
{% endblock %}
